  - url: https://developer.eposnowhq.com/Docs/Authentication
    type: Documentation
    note: Basic auth; Base64(API Key:API Secret) as Authorization Basic token. Per-device credentials.
  - url: https://developer.eposnowhq.com/Setup/ApiDevice
    type: Documentation
    note: Registering an API Device under Web Integrations in the Back Office; key/secret and regenerate.
  - url: https://developer.eposnowhq.com/Docs/Api?endpoint=Product
    type: APIReference
    note: Product CRUD under /api/V2/Product. Marked deprecated in favor of V4.
  - url: https://developer.eposnowhq.com/Docs/Api?endpoint=Transaction
    type: APIReference
    note: Transaction (sales record) CRUD under /api/V2/Transaction, 200 per page.
  - url: https://developer.eposnowhq.com/Docs/Api?endpoint=Customer
    type: APIReference
    note: Customer CRUD under /api/V2/Customer.
  - url: https://developer.eposnowhq.com/Docs/Api?endpoint=Category
    type: APIReference
    note: Category CRUD under /api/V2/Category.
  - url: https://developer.eposnowhq.com/Docs/Api?endpoint=Device
    type: APIReference
    note: Device listing under /api/V2/Device.
  - url: https://developer.eposnowhq.com/Docs/Webhooks
    type: Documentation
    note: Webhooks are outbound HTTP POST notifications with Epos-Object and Epos-Action headers. Not a WebSocket.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Epos Now's own public API is
    request/response REST (EposNow HQ REST API) plus outbound Webhooks. No
    AsyncAPI document was created because there is no server-push WebSocket or
    streaming transport on Epos Now's API to model; the only push mechanism is
    outbound HTTP webhook callbacks.
