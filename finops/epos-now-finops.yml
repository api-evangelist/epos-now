description: >-
  FinOps view of Epos Now spend. Epos Now is a commercial cloud POS subscription
  rather than a usage-metered API. The dominant cost lines are the per-till
  software subscription, one-time or financed till hardware, integrated card
  processing fees (a percentage of transactions), and optional premium support.
  The REST API itself carries no separate per-call charge - it is included with
  the subscription and enabled per API Device (each consuming a device license).
  Cost management therefore focuses on the number of tills/licenses, the payment
  processing rate applied to sales volume, contract length, and support tier
  rather than on API call metering.
notes: >-
  Per-unit rates vary by region, promotion, and contract and are not reconciled
  here; verify against a current Epos Now quote. The largest variable cost for
  most merchants is card processing fees scaling with transaction volume, not
  the fixed software subscription.
