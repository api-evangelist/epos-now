meters:
- name: till_subscription
  description: Per-till monthly software subscription; the primary recurring cost.
  unit: tills
  aggregation: sum
  dimensions:
  - account
  - location
- name: hardware
  description: One-time or financed till hardware (terminal, cash drawer, printer).
  unit: bundles
  aggregation: sum
  dimensions:
  - account
  - location
- name: card_processing
  description: Integrated payment processing fees charged as a percentage of transaction value.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - location
  - device
- name: premium_support
  description: Optional 24/7 support add-on billed monthly per account.
  unit: months
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track spend by till/location - subscription per till, hardware, and card-processing fees against sales volume.
- name: Allocation
  description: Map tills and API Devices to specific locations or business units so cost maps to internal cost centers.
- name: Optimization
  description: Right-size the number of tills and device licenses, negotiate card-processing rates against volume, and match the support tier to actual need; the API adds no incremental per-call cost.
- name: Accountability
  description: Review monthly subscription, support, and processing fees per location; reconcile against a current Epos Now quote since rates vary by region and promotion.
