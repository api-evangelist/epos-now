aid: epos-now
url: https://raw.githubusercontent.com/api-evangelist/epos-now/refs/heads/main/apis.yml
name: Epos Now
kind: company
description: Epos Now is a cloud-based point of sale (POS) platform for retail and
  hospitality businesses, pairing countertop and mobile till hardware with a
  cloud Back Office for products, inventory, customers, staff, reporting, and
  payments. The EposNow HQ REST API lets developers programmatically read and
  write that cloud data - products, categories, transactions (sales), customers,
  stock, tax rates, and devices - using per-device Basic authentication, with
  Webhooks for event notifications. API access is enabled per registered API
  Device from the Back Office and is available through the Epos Now AppStore
  rather than sold as a standalone metered API product.
